<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1200" height="340" viewBox="0 0 1200 340">
  <title id="title">Silvana Ovarista</title>
  <desc id="desc">Full-stack web developer and applied ML enthusiast. Abstract teal and purple flowing lines on a deep blue background.</desc>
  <defs>
